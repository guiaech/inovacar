[project]
name = "car-aberto"
version = "0.1.0"
description = "Pipeline aberto para publicar a base do CAR em formato cloud-native, com API OGC e historico de mudancas."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Guilherme Andrade e Chaves" }]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=16",
    "duckdb>=1.1",
    "h3>=4.1",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "geoparquet-io>=1.7.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["car_aberto"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
